<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bank CRM — UAE Pass Application Approval Flow</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f8; padding: 24px; }
.dl-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
.dl-btn { padding: 8px 20px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600;
          cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: 'Segoe UI', Arial, sans-serif; }
.dl-btn.pdf { background: #1a1a2e; color: #fff; }
.dl-btn.png { background: #2563eb; color: #fff; }
.dl-btn:hover { opacity: 0.85; }
#dl-progress { display:none; text-align:center; font-size:11px; color:#2563eb; margin-bottom:8px; }

.diagram-wrap { background:#fff; border-radius:14px; padding:16px;
                box-shadow:0 2px 12px rgba(0,0,0,.09); overflow:auto; }
svg { display:block; }
.zoom-bar { display:flex; align-items:center; justify-content:center; gap:8px;
            margin-bottom:12px; flex-wrap:wrap; }
.z-btn { padding:5px 14px; border:1.5px solid #CBD5E1; border-radius:6px; background:#fff;
         font-size:12px; font-weight:600; cursor:pointer; color:#334155;
         font-family:'Segoe UI',Arial,sans-serif; transition:.15s; }
.z-btn:hover { background:#F1F5F9; }
.z-btn.active { background:#1D4ED8; color:#fff; border-color:#1D4ED8; }
#zoom-label { font-size:12px; font-weight:700; color:#334155; min-width:40px;
              text-align:center; font-family:'Segoe UI',Arial,sans-serif; }
.legend-wrap { background:#fff; border-radius:14px; padding:20px 28px;
               margin-top:16px; box-shadow:0 1px 6px rgba(0,0,0,.07); }
.legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; }
.legend-item { display:flex; align-items:center; gap:7px; font-size:11px; color:#475569;
               font-family:'Segoe UI',Arial,sans-serif; }
.legend-swatch { width:24px; height:14px; border-radius:4px; border:1.5px solid; flex-shrink:0; }
@media print { .dl-bar,#dl-progress,.zoom-bar { display:none!important; } body { padding:8px; background:#fff; } }
</style>
</head>
<body>

<div class="dl-bar">
  <button class="dl-btn pdf" onclick="window.print()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14,2 14,8 20,8"/>
    </svg>Save as PDF
  </button>
  <button class="dl-btn png" onclick="downloadPNG()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21,15 16,10 5,21"/>
    </svg>Download PNG
  </button>
</div>
<div id="dl-progress">Rendering at 2.5× — please wait…</div>


<!-- ZOOM CONTROLS -->
<div class="zoom-bar">
  <span style="font-size:11px;color:#64748B;font-family:'Segoe UI',Arial,sans-serif">Zoom:</span>
  <button class="z-btn" onclick="setZoom(zPct-10)">−</button>
  <span id="zoom-label">—</span>
  <button class="z-btn" onclick="setZoom(zPct+10)">+</button>
  <button class="z-btn" id="btn-fit" onclick="fitWidth()">Fit Width</button>
  <button class="z-btn" onclick="setZoom(100)">100%</button>
  <button class="z-btn" onclick="setZoom(50)">50%</button>
</div>

<script>
// ── Zoom controls ──
let zPct = 55;
const SVG_W = 2600, SVG_H = 1000;

function setZoom(pct) {
  zPct = Math.min(Math.max(Math.round(pct), 20), 250);
  const svg = document.getElementById('mainsvg');
  svg.setAttribute('width',  Math.round(SVG_W * zPct / 100));
  svg.setAttribute('height', Math.round(SVG_H * zPct / 100));
  document.getElementById('zoom-label').textContent = zPct + '%';
}

function fitWidth() {
  const wrap = document.getElementById('diagram-wrap');
  const avail = wrap.clientWidth - 32;
  setZoom(Math.floor(avail / SVG_W * 100));
}

window.addEventListener('load', fitWidth);
window.addEventListener('resize', fitWidth);

// ── PNG export ──
async function downloadPNG() {
  const bar = document.querySelector('.dl-bar');
  const prog = document.getElementById('dl-progress');
  bar.style.display = 'none';
  prog.style.display = 'block';
  try {
    const canvas = await html2canvas(document.body, {
      scale: 2.5, useCORS: true, backgroundColor: '#f0f2f8', logging: false
    });
    const a = document.createElement('a');
    a.download = 'BankCRM_UAEPass_Approval_Flow.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  } catch(e) {
    alert('PNG export failed. Use Save as PDF instead.');
  } finally {
    prog.style.display = 'none';
    bar.style.display = 'flex';
  }
}
</script>
