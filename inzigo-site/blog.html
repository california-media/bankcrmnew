<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RBBQLTFE0R"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-RBBQLTFE0R');

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blog — Mysilah</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0F1E;--ink-2:#1A2036;--muted:#6B7186;--muted-2:#9AA0B4;--line:#E8E8EE;--line-2:#F0F0F4;
    --bg:#FFFFFF;--bg-soft:#FAFAFB;--violet:#7C3AED;--indigo:#8B5CF6;--blue:#0EA5E9;
    --grad:linear-gradient(135deg,#7C3AED 0%,#8B5CF6 45%,#0EA5E9 100%);
    --mono:'SF Mono','Fira Code','Fira Mono',monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-0.011em}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1240px;margin:0 auto;padding:0 32px}
  @media(max-width:768px){.wrap{padding:0 20px}}

  /* NAV */
  .nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line-2)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
  .logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .logo img{height:32px;width:auto}
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;padding:9px 18px;border-radius:999px;transition:all .25s;letter-spacing:-0.01em;cursor:pointer}
  .btn-ghost{border:1px solid var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--violet);color:var(--violet)}
  .btn-grad{background:var(--grad);color:#fff;border:none}.btn-grad:hover{opacity:.88}

  /* SPLIT HEADER: text left | image right */
  .post-header{background:var(--bg-soft);border-bottom:1px solid var(--line-2);padding:52px 0 0}
  .post-header-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
  @media(max-width:860px){.post-header-grid{grid-template-columns:1fr;gap:32px}}
  .post-header-text{padding-bottom:52px}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);transition:color .2s;margin-bottom:24px}
  .back-link:hover{color:var(--violet)}
  .back-link svg{flex-shrink:0}
  .post-header-meta{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .post-tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:5px 13px;border-radius:999px;border:1px solid}
  .post-date{font-family:var(--mono);font-size:11px;color:var(--muted-2);letter-spacing:0.05em;text-transform:uppercase}
  .post-dot{width:3px;height:3px;border-radius:50%;background:var(--muted-2);flex-shrink:0}
  .post-title{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.06;letter-spacing:-0.03em;color:var(--ink);margin-bottom:18px}
  .post-excerpt{font-size:17px;line-height:1.65;color:var(--muted)}
  /* Image panel: flush bottom with the header, rounded top corners */
  .post-header-img{height:420px;border-radius:16px 16px 0 0;overflow:hidden;align-self:flex-end}
  @media(max-width:860px){.post-header-img{height:260px;border-radius:16px}}
  .post-header-img img{width:100%;height:100%;object-fit:contain;object-position:center center;display:block;background:var(--bg-soft)}
  .post-header-img-placeholder{width:100%;height:100%;background:var(--grad);opacity:0.15}

  /* BODY: two-column */
  .post-body{padding:56px 0 96px}
  .post-layout{display:grid;grid-template-columns:1fr 288px;gap:52px;align-items:start}
  @media(max-width:960px){.post-layout{grid-template-columns:1fr}}

  /* ARTICLE */
  .post-content{font-size:17px;line-height:1.82;color:var(--ink-2)}
  .post-content h1{font-size:28px;font-weight:800;letter-spacing:-0.025em;margin:0 0 20px;color:var(--ink)}
  .post-content h2{font-size:23px;font-weight:700;letter-spacing:-0.02em;margin:52px 0 14px;color:var(--ink);padding-top:8px;border-top:1px solid var(--line-2)}
  .post-content h3{font-size:19px;font-weight:600;margin:36px 0 10px;color:var(--ink)}
  .post-content p{margin-bottom:22px}
  .post-content ul,.post-content ol{margin:0 0 22px 26px}
  .post-content li{margin-bottom:10px}
  .post-content strong{font-weight:600;color:var(--ink)}
  .post-content em{font-style:italic}
  .post-content a{color:var(--violet);text-decoration:underline;text-underline-offset:3px}
  .post-content blockquote{border-left:4px solid var(--violet);padding:14px 22px;background:rgba(124,58,237,0.04);border-radius:0 12px 12px 0;margin:28px 0;color:var(--muted);font-style:italic}
  .post-content img{max-width:100%;border-radius:12px;margin:12px 0;border:1px solid var(--line)}
  .post-content hr{border:none;border-top:1px solid var(--line-2);margin:40px 0}
  .post-content table{width:100%;border-collapse:collapse;margin-bottom:22px;font-size:15px}
  .post-content th,.post-content td{padding:10px 14px;border:1px solid var(--line);text-align:left}
  .post-content th{background:var(--bg-soft);font-weight:600}

  /* GALLERY */
  .post-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:48px;padding-top:40px;border-top:1px solid var(--line-2)}
  .post-gallery img{width:100%;height:200px;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block;transition:opacity .2s}
  .post-gallery img:hover{opacity:0.85}

  /* SIDEBAR */
  .post-sidebar{display:flex;flex-direction:column;gap:20px;position:sticky;top:88px}
  @media(max-width:960px){.post-sidebar{position:static}}
  .sidebar-card{background:var(--bg-soft);border:1px solid var(--line);border-radius:16px;padding:20px}
  .sidebar-title{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted-2);margin-bottom:14px}
  .search-wrap{position:relative}
  .search-input{width:100%;padding:10px 42px 10px 14px;border:1px solid var(--line);border-radius:10px;font-family:var(--sans);font-size:14px;color:var(--ink);outline:none;transition:border-color .2s;background:#fff}
  .search-input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,0.08)}
  .search-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--grad);border:none;border-radius:7px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cat-list{display:flex;flex-direction:column;gap:4px}
  .cat-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .15s;font-size:13px;font-weight:500;color:var(--ink-2)}
  .cat-item:hover{background:rgba(124,58,237,0.07);color:var(--violet)}
  .cat-item-img{width:34px;height:24px;object-fit:cover;border-radius:5px;flex-shrink:0;border:1px solid var(--line)}
  .cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

  /* LOADING / ERROR */
  .post-loading{text-align:center;padding:120px 32px;color:var(--muted);font-size:16px}
  .spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 20px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* FOOTER */
  .mini-footer{border-top:1px solid var(--line-2);padding:28px 0;text-align:center;font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <div class="nav-inner">
      <a href="/" class="logo"><img src="mysilah.svg" alt="Mysilah"></a>
      <div style="display:flex;gap:12px">
        <a href="https://app.mysilah.ae/login/" target="_blank" class="btn btn-ghost">Sign in</a>
        <a href="https://app.mysilah.ae/register/" target="_blank" class="btn btn-grad">Get started</a>
      </div>
    </div>
  </div>
</nav>

<div id="post-root">
  <div class="post-loading">
    <div class="spinner"></div>
    Loading article…
  </div>
</div>

<footer class="mini-footer">
  <div class="wrap">© 2026 Mysilah · <a href="/" style="color:var(--violet)">Back to home</a></div>
</footer>

<script>
(function () {
  var COLOR_HEX = { violet:'#7C3AED', blue:'#0EA5E9', green:'#10A36A', orange:'#F97316', teal:'#0D9488', red:'#EF4444', pink:'#EC4899' };

  function fmtDate(d) {
    return new Date(d).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  function getSlug() {
    var hash = location.hash.replace(/^#/, '');
    if (hash) return decodeURIComponent(hash);
    var m = location.search.match(/[?&]slug=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function hexAlpha(hex, a) {
    if (!hex) return 'rgba(124,58,237,'+a+')';
    var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

  var slug = getSlug();
  if (!slug) {
    document.getElementById('post-root').innerHTML =
      '<div class="post-loading">No post specified. <a href="/" style="color:var(--violet)">Go home →</a></div>';
    return;
  }

  var apiBase     = location.hostname === 'localhost' ? 'http://localhost:8000/api' : 'https://api.mysilah.ae/api';
  var uploadsBase = 'https://mysilah.s3.us-east-1.amazonaws.com';
  var allCategories = [];

  function getCatData(name) {
    return allCategories.find(function(c){ return (c.name||'').toLowerCase() === (name||'').toLowerCase(); }) || null;
  }

  function renderSidebar() {
    var html = '<aside class="post-sidebar">';

    html += '<div class="sidebar-card">';
    html += '<div class="sidebar-title">Search Articles</div>';
    html += '<div class="search-wrap">';
    html += '<input id="sb-search" class="search-input" type="text" placeholder="Search articles…" onkeydown="if(event.key===\'Enter\')doSearch()">';
    html += '<button class="search-btn" onclick="doSearch()">';
    html += '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>';
    html += '</button></div></div>';

    if (allCategories.length) {
      html += '<div class="sidebar-card"><div class="sidebar-title">Categories</div><div class="cat-list">';
      allCategories.forEach(function(c) {
        var hex   = COLOR_HEX[c.color] || '#7C3AED';
        var imgEl = c.image
          ? '<img class="cat-item-img" src="'+uploadsBase+'/blog-category-images/'+c.image+'" alt="">'
          : '<span class="cat-dot" style="background:'+hex+'"></span>';
        html += '<div class="cat-item" onclick="goCat(\''+esc(c.name)+'\')">'+imgEl+'<span>'+esc(c.name)+'</span></div>';
      });
      html += '</div></div>';
    }

    html += '</aside>';
    return html;
  }

  window.doSearch = function() {
    var q = encodeURIComponent(document.getElementById('sb-search').value || '');
    location.href = 'blogs.html' + (q ? '?q='+q : '');
  };

  window.goCat = function(name) {
    location.href = 'blogs.html?cat=' + encodeURIComponent(name);
  };

  fetch(apiBase + '/public/blog-categories')
    .then(function(r){ return r.json(); })
    .then(function(cats){ if (Array.isArray(cats)) allCategories = cats; })
    .catch(function(){})
    .then(function(){
      return fetch(apiBase + '/public/blogs/' + encodeURIComponent(slug));
    })
    .then(function(r) {
      if (!r.ok) throw new Error('not found');
      return r.json();
    })
    .then(function(post) {
      document.title = post.title + ' — Mysilah Blog';

      var catData  = getCatData(post.category);
      var catHex   = catData ? (COLOR_HEX[catData.color] || '#7C3AED') : '#7C3AED';
      var catLabel = post.category ? post.category.charAt(0).toUpperCase()+post.category.slice(1) : '';
      var dateStr  = post.publishedDate ? fmtDate(post.publishedDate) : '';
      var readStr  = post.readTime ? post.readTime + ' min read' : '';

      var detailImgs = Array.isArray(post.detailImages) ? post.detailImages : [];

      // Hero image (right panel): post image → category image → placeholder
      var heroImgFile = detailImgs[0] || post.coverImage;
      var heroImgHtml;
      if (heroImgFile) {
        heroImgHtml = '<img src="'+uploadsBase+'/blog-images/'+heroImgFile+'" alt="'+esc(post.title)+'">';
      } else if (catData && catData.image) {
        heroImgHtml = '<img src="'+uploadsBase+'/blog-category-images/'+catData.image+'" alt="">';
      } else {
        heroImgHtml = '<div class="post-header-img-placeholder"></div>';
      }

      // Gallery: remaining detail images
      var galleryHtml = '';
      if (detailImgs.length > 1) {
        var imgs = detailImgs.slice(1).map(function(img) {
          return '<img src="'+uploadsBase+'/blog-images/'+img+'" alt="">';
        }).join('');
        galleryHtml = '<div class="post-gallery">'+imgs+'</div>';
      }

      var tagStyle = 'background:'+hexAlpha(catHex,0.1)+';border-color:'+hexAlpha(catHex,0.25)+';color:'+catHex;

      var html =
        // SPLIT HEADER: text left | image right (flush to bottom of header)
        '<div class="post-header">' +
          '<div class="wrap">' +
            '<div class="post-header-grid">' +
              '<div class="post-header-text">' +
                '<a href="blogs.html" class="back-link">' +
                  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>' +
                  'All Articles' +
                '</a>' +
                '<div class="post-header-meta">' +
                  (catLabel ? '<span class="post-tag" style="'+tagStyle+'">'+esc(catLabel)+'</span>' : '') +
                  (dateStr ? '<span class="post-dot"></span><span class="post-date">'+dateStr+'</span>' : '') +
                  (readStr ? '<span class="post-dot"></span><span class="post-date">'+readStr+'</span>' : '') +
                '</div>' +
                '<h1 class="post-title">'+esc(post.title)+'</h1>' +
                (post.excerpt ? '<p class="post-excerpt">'+esc(post.excerpt)+'</p>' : '') +
              '</div>' +
              '<div class="post-header-img">'+heroImgHtml+'</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        // ARTICLE BODY: content + sidebar
        '<div class="post-body">' +
          '<div class="wrap">' +
            '<div class="post-layout">' +
              '<main>' +
                '<div class="post-content">' +
                  (post.content || '<p style="color:var(--muted);font-style:italic">Content coming soon.</p>') +
                '</div>' +
                galleryHtml +
              '</main>' +
              renderSidebar() +
            '</div>' +
          '</div>' +
        '</div>';

      document.getElementById('post-root').innerHTML = html;
    })
    .catch(function() {
      document.getElementById('post-root').innerHTML =
        '<div class="post-loading">Article not found. <a href="/" style="color:var(--violet)">Go home →</a></div>';
    });
})();
</script>
</body>
</html>
